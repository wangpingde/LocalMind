[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localmind"
version = "0.3.0"
description = "LocalMind（智匣）— 本地个人 Agent 客户端"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "LocalMind Team"},
]

dependencies = [
    # UI
    "PySide6>=6.6.0",

    # Local API
    "fastapi>=0.110.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.27.0",
    "sse-starlette>=2.0.0",

    # Database
    "SQLAlchemy>=2.0.0",

    # Vector store
    "lancedb>=0.6.0",
    "pyarrow>=15.0.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",

    # AI providers
    "openai>=1.12.0",
    "httpx>=0.27.0",

    # Document parsing
    "pymupdf>=1.23.0",
    "python-docx>=1.1.0",
    "markdown>=3.5.0",
    "openpyxl>=3.1.0",
    "python-pptx>=0.6.23",
    "beautifulsoup4>=4.12.0",

    # RAG utilities
    "tiktoken>=0.6.0",

    # Security
    "keyring>=25.0.0",

    # Configuration
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "PyYAML>=6.0.0",

    # File watching & logging
    "watchdog>=4.0.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-qt>=4.3.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]
build = [
    "pyinstaller>=6.3.0",
]

[project.scripts]
localmind = "app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["resources/**/*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
