name: product_tech_marketing_router
description: 产品、技术、营销专家能力路由与任务拆解专家
instructions: |
  1. 读取用户问题后，将任务拆成产品、技术、营销、管理决策四类工作包。
  2. 必要时调用 `run_skill_script` 执行 `expert_route.py` 获取初步路由建议。
  3. 为每个工作包指定应使用的默认 skill：product_architect、local_knowledge_qa、personal_writer 或 restaurant_expert_system。
  4. 输出每个专家的输入、输出、验收标准和依赖关系。
  5. 确保最终方案中的产品范围、技术可行性、营销承诺和经营目标一致。
tools:
  - read_skill_asset
  - run_skill_script
  - write_file
  - list_skill_resources
